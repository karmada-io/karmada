# test case for aggregating status of HelmRelease
# case1. HelmRelease propagated to two clusters
# case2. HelmRelease not propagated to any cluster

name: "HelmRelease propagated to two clusters"
description: "Test aggregating status of HelmRelease divided across two member clusters"
desiredObj:
  apiVersion: helm.toolkit.fluxcd.io/v2
  kind: HelmRelease
  metadata:
    name: podinfo
    namespace: default
    generation: 1
  spec:
    interval: 5m
    values:
      replicaCount: 4
  status:
    failures: 5
statusItems:
  - applied: true
    clusterName: member1
    status:
      generation: 1
      observedGeneration: 1
      resourceTemplateGeneration: 1
      helmChart: default-podinfo
      storageNamespace: default
      lastAttemptedRevision: 6.5.0
      lastAttemptedReleaseAction: install
      failures: 1
      installFailures: 1
      conditions:
        - type: Ready
          status: "True"
          reason: InstallSucceeded
          message: Helm install succeeded
  - applied: true
    clusterName: member2
    status:
      generation: 1
      observedGeneration: 1
      resourceTemplateGeneration: 1
      helmChart: default-podinfo
      storageNamespace: default
      lastAttemptedRevision: 6.5.0
      lastAttemptedReleaseAction: install
      failures: 0
      installFailures: 0
      conditions:
        - type: Ready
          status: "True"
          reason: InstallSucceeded
          message: Helm install succeeded
operation: AggregateStatus
output:
  aggregatedStatus:
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: podinfo
      namespace: default
      generation: 1
    spec:
      interval: 5m
      values:
        replicaCount: 4
    status:
      observedGeneration: 1
      helmChart: default-podinfo
      storageNamespace: default
      lastAttemptedRevision: 6.5.0
      lastAttemptedReleaseAction: install
      failures: 1
      installFailures: 1
      upgradeFailures: 0
      conditions:
        - type: Ready
          status: "True"
          reason: InstallSucceeded
          message: member1=Helm install succeeded, member2=Helm install succeeded

---
name: "HelmRelease not propagated to any cluster"
description: "Test aggregating status of HelmRelease without status items"
desiredObj:
  apiVersion: helm.toolkit.fluxcd.io/v2
  kind: HelmRelease
  metadata:
    name: podinfo
    namespace: default
    generation: 2
  spec:
    interval: 5m
operation: AggregateStatus
output:
  aggregatedStatus:
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: podinfo
      namespace: default
      generation: 2
    spec:
      interval: 5m
    status:
      observedGeneration: 2
