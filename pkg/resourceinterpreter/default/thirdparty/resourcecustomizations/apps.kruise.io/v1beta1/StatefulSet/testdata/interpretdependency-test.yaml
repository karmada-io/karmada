# test case for interpreting dependency of StatefulSet
# case1. StatefulSet with configmap and secret dependency
# case2. StatefulSet with a PVC volume backed by volumeClaimTemplates

name: "StatefulSet with configmap and secret dependency"
description: "InterpretDependency should return configmap and secret references"
desiredObj:
  apiVersion: apps.kruise.io/v1beta1
  kind: StatefulSet
  metadata:
    name: sample
    namespace: test-ns
  spec:
    replicas: 1
    template:
      metadata:
        labels:
          app: sample
      spec:
        volumes:
          - name: config-vol
            configMap:
              name: my-config
        containers:
          - name: nginx
            image: nginx:alpine
            env:
              - name: SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: my-secret
                    key: password
operation: InterpretDependency
output:
  dependencies:
    - apiVersion: v1
      kind: ConfigMap
      name: my-config
      namespace: test-ns
    - apiVersion: v1
      kind: Secret
      name: my-secret
      namespace: test-ns

---
name: "StatefulSet with volumeClaimTemplates"
description: "PVC placeholders that match a volumeClaimTemplate are managed by the StatefulSet and must not be reported as dependencies"
desiredObj:
  apiVersion: apps.kruise.io/v1beta1
  kind: StatefulSet
  metadata:
    name: web
    namespace: default
  spec:
    replicas: 3
    serviceName: nginx
    selector:
      matchLabels:
        app: nginx
    template:
      metadata:
        labels:
          app: nginx
      spec:
        volumes:
          - name: www
            persistentVolumeClaim:
              claimName: www
        containers:
          - name: nginx
            image: nginx
            volumeMounts:
              - name: www
                mountPath: /usr/share/nginx/html
    volumeClaimTemplates:
      - metadata:
          name: www
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
operation: InterpretDependency
output:
  dependencies: []
