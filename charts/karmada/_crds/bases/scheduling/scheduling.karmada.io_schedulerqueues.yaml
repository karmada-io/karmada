---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: schedulerqueues.scheduling.karmada.io
spec:
  group: scheduling.karmada.io
  names:
    categories:
    - karmada-io
    kind: SchedulerQueue
    listKind: SchedulerQueueList
    plural: schedulerqueues
    shortNames:
    - sq
    singular: schedulerqueue
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SchedulerQueue configures per-tenant scheduling queue settings.
          It is cluster-scoped so that only cluster admins can create it.
          ResourceBindings in namespaces matching the NamespaceSelector are
          routed to this queue for scheduling.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired queue configuration.
            properties:
              backoffConfig:
                description: BackoffConfig tunes the retry backoff for this tenant's
                  backoff queue.
                properties:
                  initialDuration:
                    default: 1s
                    description: InitialDuration is the backoff duration for the first
                      retry.
                    type: string
                  maxDuration:
                    default: 10s
                    description: MaxDuration is the maximum backoff duration.
                    type: string
                type: object
              namespaceSelector:
                description: |-
                  NamespaceSelector selects the namespaces whose ResourceBindings
                  this queue governs.
                properties:
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: MatchLabels selects namespaces by label. Reserved
                      for Phase 2.
                    type: object
                  names:
                    description: Names is a list of exact namespace names.
                    items:
                      type: string
                    type: array
                type: object
              queueingStrategy:
                default: BestEffortFIFO
                description: |-
                  QueueingStrategy controls the ordering and blocking behavior of
                  bindings in the active queue.
                enum:
                - BestEffortFIFO
                - StrictFIFO
                type: string
              unschedulableConfig:
                description: |-
                  UnschedulableConfig tunes how long bindings may sit in the
                  unschedulable set before being flushed back to the active queue.
                properties:
                  maxDuration:
                    default: 5m
                    description: |-
                      MaxDuration is the maximum time a binding may remain in the
                      unschedulable set. After this, it is moved to the backoff or active queue.
                    type: string
                type: object
            required:
            - namespaceSelector
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
