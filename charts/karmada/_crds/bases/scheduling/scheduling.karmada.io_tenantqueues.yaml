              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired queue configuration.
            properties:
              namespaceSelector:
                description: |-
                  NamespaceSelector selects the namespaces whose ResourceBindings
                  this queue governs. An empty selector ({}) matches all namespaces.
                  A nil selector matches no namespaces.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
